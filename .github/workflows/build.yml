name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"   # daily: picks up new php:8.4-apache security releases
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # pull: always build on the newest base image. The GHA layer cache keeps the
      # result identical (same digest) when nothing changed, so servers only see a
      # "new" image when PHP or this repo actually changed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webapps-web:latest
            ghcr.io/${{ github.repository_owner }}/webapps-web:php8.4
          cache-from: type=gha
          cache-to: type=gha,mode=max
