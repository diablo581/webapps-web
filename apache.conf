ServerTokens Prod
ServerSignature Off
ServerName ${SERVER_NAME}

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
</Directory>
# Drama Inventory: keep its SQLite DB private and never execute anything uploaded.
<Files "*.db">
    Require all denied
</Files>
<Directory /var/www/html/inventory/uploads>
    php_admin_flag engine off
    Options -ExecCGI
    RemoveHandler .cgi .pl
</Directory>


Alias /asset/ /var/www/asset/cgi-bin/
<Directory /var/www/asset/cgi-bin/>
    AddHandler cgi-script .cgi .pl
    Options ExecCGI FollowSymLinks Indexes
    DirectoryIndex index.cgi
    AuthType Basic
    AuthName "Asset System Please use your network ID"
    AuthBasicProvider ldap
    # AD referral chasing can hang or fail LDAP auth.
    LDAPReferrals Off
    AuthLDAPURL "${LDAP_URL}"
    AuthLDAPBindDN "${LDAP_BIND_DN}"
    AuthLDAPBindPassword "${LDAP_BIND_PASSWORD}"
    Require user ${ASSET_USERS}
</Directory>

Alias /asset-new/ /var/www/asset-new/
<Directory /var/www/asset-new/>
    Options FollowSymLinks Indexes
    AuthType Basic
    AuthName "Asset System Please use your network ID"
    AuthBasicProvider ldap
    # AD referral chasing can hang or fail LDAP auth.
    LDAPReferrals Off
    AuthLDAPURL "${LDAP_URL}"
    AuthLDAPBindDN "${LDAP_BIND_DN}"
    AuthLDAPBindPassword "${LDAP_BIND_PASSWORD}"
    Require user ${ASSET_USERS}
</Directory>
